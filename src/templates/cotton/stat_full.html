<div class="bg-zinc-300 dark:bg-zinc-700 rounded-lg shadow-sm border border-zinc-100 dark:border-zinc-700 p-4 hover:shadow-md transition-shadow duration-200 w-56">
    <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="p-2 rounded-lg bg-blue-50 dark:bg-blue-500/20 w-10 h-10 flex items-center justify-center">
                <div class="text-xl text-blue-700 dark:text-blue-400">
                    <i class="fas fa-{{ icon|default:'fa-chart-line' }}"></i>
                </div>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <p class="text-lg font-semibold text-zinc-900 dark:text-zinc-100 truncate">{{ value }}</p>
                </div>
                <p class="text-sm font-medium text-zinc-700 dark:text-zinc-400 truncate">{{ title }}</p>
            </div>
        </div>
    </div>
</div>
