<div class="relative group">
    <div class="flex items-center gap-1 bg-zinc-300 dark:bg-zinc-700 rounded-full px-2 py-1">
        <i class="fas fa-{{ icon }} text-xs"></i>
        <span class="text-xs font-medium">{{ value }}</span>
    </div>
    <div class="absolute left-1/2 -translate-x-1/2 -top-6 bg-zinc-800 dark:bg-zinc-200 text-zinc-100 dark:text-zinc-900 text-xs rounded px-2 py-0.5 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
        {{ title }}
    </div>
</div>
