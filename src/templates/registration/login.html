{% extends "base.html" %}
{% block title %}Login - {{ INST_SHORT_NAME }} PeerEval{% endblock %}

{% block content %}
<div class="flex items-center justify-center">
    <div class="flex flex-col justify-center w-1/2 max-w-md bg-zinc-200 dark:bg-zinc-800 rounded-lg p-4 shadow-lg mt-2/3 mb-2/3">
        <h1 class="text-2xl font-bold text-center mb-4">SYSTEM LOGIN</h1>
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <c-input_text type="text" label="USERNAME" name="username" id="username"/>
            <c-input_text type="password" label="PASSWORD" name="password" id="password"/>
            <c-btn_action type="submit" label="LOGIN"/>
        </form>
        <div class="mt-4 text-center">
            <a href="{% url 'password_reset_request' %}" class="text-blue-500 hover:text-blue-700">Forgot Password?</a>
        </div>
    </div>
</div>
{% endblock %}
