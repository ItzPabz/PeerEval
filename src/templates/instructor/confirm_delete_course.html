{% extends 'base.html' %}
{% block title %}Confirm Course Deletion - {{ INST_SHORT_NAME }} PeerEval{% endblock %}

{% block content %}
<script>
    function confirmDelete() {
        const message = `{{ confirmation_message|escapejs }}`;
        if (confirm(message)) {
            document.getElementById('delete-form').submit();
        } else {
            window.location.href = "{% url 'index' %}";
        }
    }
</script>

<div class="flex flex-col items-center justify-center min-h-screen bg-gray-100 dark:bg-gray-900">
    <div class="w-full max-w-md p-6 bg-white dark:bg-gray-800 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-4 text-gray-900 dark:text-white">Delete Course</h2>
        
        <form id="delete-form" method="post" action="{% url 'delete_course' course.id %}">
            {% csrf_token %}
            <div class="mb-4">
                <p class="text-gray-700 dark:text-gray-300">
                    {{ confirmation_message|linebreaks }}
                </p>
            </div>
            
            <div class="flex justify-end space-x-4">
                <a href="{% url 'index' %}" class="px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 rounded">
                    Cancel
                </a>
                <button type="button" onclick="confirmDelete()" class="px-4 py-2 bg-red-600 text-white hover:bg-red-700 rounded">
                    Delete Course
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
